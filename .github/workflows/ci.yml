name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    name: Python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install dependencies (real resolution of requirements.txt)
        run: python -m pip install -r requirements-dev.txt
      - name: Unit and UI smoke tests
        run: python -m unittest discover -s tests -v

  mcp-smoke:
    name: Playwright MCP end-to-end (no LLM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Drive a real browser through the pinned Playwright MCP server
        env:
          BROWSERPILOT_BROWSER: chrome
          BROWSERPILOT_NO_SANDBOX: "1"
        run: node scripts/mcp_smoke_test.mjs --screenshot "$RUNNER_TEMP/pricing.png"
      - uses: actions/upload-artifact@v4
        with:
          name: smoke-test-screenshot
          path: ${{ runner.temp }}/pricing.png
